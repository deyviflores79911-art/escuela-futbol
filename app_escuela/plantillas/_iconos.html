{# Iconos SVG en línea: toman el color del texto (currentColor) #}
{% macro icono(nombre) -%}
<svg class="icono icono-{{ nombre }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if nombre == 'check' -%}<path d="M20 6 9 17l-5-5"/>
{%- elif nombre == 'alerta' -%}<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
{%- elif nombre == 'info' -%}<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
{%- elif nombre == 'cruz' -%}<path d="M18 6 6 18M6 6l12 12"/>
{%- elif nombre == 'sol' -%}<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
{%- elif nombre == 'luna' -%}<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
{%- elif nombre == 'mas' -%}<path d="M12 5v14M5 12h14"/>
{%- elif nombre == 'casa' -%}<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/>
{%- elif nombre == 'personas' -%}<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/>
{%- elif nombre == 'billetera' -%}<rect x="2.5" y="5.5" width="19" height="14" rx="2.5"/><path d="M2.5 9.5h19M16.5 14.5h1.5"/>
{%- elif nombre == 'reporte' -%}<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
{%- elif nombre == 'persona-mas' -%}<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M19 8v6M16 11h6"/>
{%- elif nombre == 'flecha' -%}<path d="m9 18 6-6-6-6"/>

{%- elif nombre == 'menu' -%}<path d="M4 6h16M4 12h16M4 18h16"/>
{%- endif -%}
</svg>
{%- endmacro %}
