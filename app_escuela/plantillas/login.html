{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<section class="tarjeta tarjeta-angosta">
  <h1>Iniciar sesión</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="campo">
      <label for="correo">Correo</label>
      <input id="correo" name="correo" type="email" value="{{ correo }}" required autofocus autocomplete="username">
    </div>
    <div class="campo">
      <label for="clave">Contraseña</label>
      <input id="clave" name="clave" type="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="boton">Entrar</button>
  </form>
</section>
{% endblock %}
